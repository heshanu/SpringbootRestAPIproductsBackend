server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mservice
    username: postgres
    password: postgres  # Ensure you provide the correct password or remove if not needed
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  application:

app:
  jwt:
    secret: ThisIsAVeryStrongSecretThatIsAtLeast64CharactersLong1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
    expiration-in-ms: 86400000
